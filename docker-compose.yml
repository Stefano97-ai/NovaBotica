name: nova-salud
services:
  db:
    image: postgres:16-alpine
    container_name: nova_salud_db
    environment:
      POSTGRES_DB: nova_salud
      POSTGRES_USER: nova_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_secret_2026}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-nova_app_2026}
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_admin -d nova_salud"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    container_name: nova_salud_backend
    environment:
      DATABASE_URL: postgresql://nova_salud_app:${APP_DB_PASSWORD:-nova_app_2026}@db:5432/nova_salud
      HOST: 0.0.0.0
      PORT: 3000
      COOKIE_SECURE: 'false'
      NOVA_CREATE_ADMIN: 'true'
      NOVA_CREDENTIALS_FILE: /app/.local/login-admin.txt
      APP_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./.local/docker:/app/.local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health/db"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
