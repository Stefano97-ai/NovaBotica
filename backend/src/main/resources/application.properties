server.port=${PORT:3000}
server.address=${HOST:0.0.0.0}
server.forward-headers-strategy=none
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

nova.allowed-origins=${APP_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://127.0.0.1:3000,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}
nova.cookie-secure=${COOKIE_SECURE:false}
nova.create-admin=${NOVA_CREATE_ADMIN:true}
nova.admin-password=${NOVA_ADMIN_PASSWORD:admin123}
nova.credentials-file=${NOVA_CREDENTIALS_FILE:login-admin.txt}

# Inventory notifications. Dates are evaluated in America/Lima.
nova.alerts.expiry-days=${ALERT_EXPIRY_DAYS:30}
nova.alerts.urgent-days=${ALERT_URGENT_DAYS:7}
nova.alerts.reconcile-ms=${ALERT_RECONCILE_MS:60000}
nova.alerts.scheduling-enabled=${ALERT_SCHEDULING_ENABLED:true}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
