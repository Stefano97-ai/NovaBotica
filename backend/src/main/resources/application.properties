server.port=${PORT:3000}
server.address=${HOST:127.0.0.1}
server.forward-headers-strategy=none
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
nova.allowed-origins=${APP_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,http://127.0.0.1:3000}
nova.cookie-secure=${COOKIE_SECURE:false}
nova.create-admin=${NOVA_CREATE_ADMIN:false}
nova.credentials-file=${NOVA_CREDENTIALS_FILE:../.local/login-admin.txt}
